<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUG@UMBC Mirrors</title>

    <link rel="icon" type="image/x-icon" href="LUG-Icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img src="LUG-Icon.png" alt="LUG@UMBC logo">
                <span>LUG@UMBC Mirrors</span>
            </a>
            <nav class="site-nav">
                <a href="https://lug.umbc.edu" target="_blank" rel="noopener">Main Site</a>
                <a href="report.html">Stats</a>
                <a href="https://uptime.blahaj.uno/status/lug" target="_blank" rel="noopener">Uptime</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h1>Available Repositories</h1>
            <p>Local mirrors of popular Linux distributions, for faster access on and around UMBC.</p>
        </section>
        <section class="mirror-list" id="mirror-list"></section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Mirrors sync automatically throughout the day.</p>
            <p>Maintained by the <a href="https://lug.umbc.edu" target="_blank" rel="noopener">UMBC Linux Users Group</a>.</p>
            <p class="muted">&copy; <span id="current-year"></span> UMBC Linux Users Group</p>
        </div>
    </footer>

    <script>
        const host = location.hostname || "mirror.lug.umbc.edu";

        // Add or edit distros here. The last-sync time is read from
        const distros = [
            { name: "Arch Linux", url: "archlinux/", about: "Rolling-release distribution for users who want full control." },
            { name: "Debian", url: "debian/", about: "Stable, widely supported distribution popular for servers." },
            { name: "EndeavourOS", url: "endeavouros/", about: "Arch-based distribution with a friendly installer." },
            { name: "Linux Mint", url: "mint/", about: "Ubuntu-based distribution with a familiar desktop experience." },
            { name: "Puppy Linux", url: "puppylinux/", about: "Lightweight distribution for minimal hardware." },
            { name: "Ubuntu", url: "ubuntu/", about: "Beginner-friendly distribution with strong community support." },
            { name: "Ubuntu Releases", url: "ubuntu-releases/", about: "CD images for recent Ubuntu releases." },
            { name: "EasyOS", url: "easyos/", iconExt: "png", about: "Experimental distribution that runs entirely in RAM." },
            { name: "Fatdog", url: "fatdog/", iconExt: "png", about: "Lightweight 64-bit distribution derived from Puppy Linux." },
            { name: "CachyOS", url: "cachyos/", about: "Arch-based distribution with a focus on performance." },
            { name: "Alpine Linux", url: "alpine/", about: "Security-oriented, lightweight distribution for servers and containers." },
        ];

        function iconFor(distro) {
            const slug = distro.url.replace(/\/$/, "");
            return `distro-icons/${slug}.${distro.iconExt || "svg"}`;
        }

        function parseSyncDate(text) {
            const match = text.match(/^Date:\s*(.+)$/m);
            if (!match) return null;
            const date = new Date(match[1]);https://mirror.lug.umbc.edu/
            return Number.isNaN(date.getTime()) ? null : date;
        }

        async function fetchSyncDate(distro) {
            try {
                const response = await fetch(`${distro.url}project/trace/${host}`);
                if (!response.ok) return null;
                return parseSyncDate(await response.text());
            } catch {
                return null;
            }
        }

        function formatSync(date) {
            const diffMs = Date.now() - date.getTime();
            const minutes = Math.floor(diffMs / 60000);
            if (minutes < 1) return "Last sync: just now";
            if (minutes < 60) return `Last sync: ${minutes} minute${minutes === 1 ? "" : "s"} ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `Last sync: ${hours} hour${hours === 1 ? "" : "s"} ago`;
            const days = Math.floor(hours / 24);
            return `Last sync: ${days} day${days === 1 ? "" : "s"} ago`;
        }

        const list = document.getElementById("mirror-list");

        distros
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach((distro) => {
                const row = document.createElement("a");
                row.className = "mirror-row";
                row.href = distro.url;
                row.innerHTML = `
                    <img class="mirror-icon" src="${iconFor(distro)}" alt="" loading="lazy">
                    <div class="mirror-main">
                        <span class="mirror-name">${distro.name}</span>
                        <span class="mirror-about">${distro.about}</span>
                    </div>
                    <span class="mirror-sync"></span>
                `;
                list.appendChild(row);

                const syncEl = row.querySelector(".mirror-sync");
                fetchSyncDate(distro).then((date) => {
                    if (date) syncEl.textContent = `Last sync: ${formatSync(date)}`;
                });
            });

        document.getElementById("current-year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
